[project]
name = "wata-transit-analysis"
version = "0.1.0"
description = "Analysis of WATA (Williamsburg Area Transit Authority) bus service effectiveness"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "requests>=2.31",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
