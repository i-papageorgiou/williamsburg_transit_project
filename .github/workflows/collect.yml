name: Collect real-time snapshot

# Polls stop_departures once every 20 minutes across WATA's service span
# (05:54-22:57 ET), using the core+rotation sample from wata.sampling: a
# ~48-stop core (every active route+direction, every poll) plus a rotating
# slice of the other ~255 served stops, so the full 303-stop network gets
# swept into the dataset over a few days without exceeding 100 IDs/call.
# Every call also requests max_num_departures=10 (the API's own max, up
# from its default of 3) at no extra call cost. Requires the
# TRANSIT_API_KEY secret and a cached stop-id mapping at
# data/processed/stop_id_mapping.json before it can do anything but exit
# early with a clear error — see src/wata/collect.py and wata/sampling.py.
#
# This is the only real-time data source for this project (WATA's Swiftly
# GTFS-RT feed is not being pursued), so the 1,500 calls/month free tier
# is the hard ceiling on reliability data collection. 20-minute polling is
# ~51 calls/day (~1,530/month) — reserve headroom by widening the interval
# if quality/plan-endpoint calls (Phase 4) are added later in the month.

on:
  schedule:
    # Every 20 minutes, 10:00-02:59 UTC = 06:00-22:59 ET (covers DST both ways).
    - cron: "*/20 10-23 * * *"
    - cron: "*/20 0-2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Collect one snapshot
        env:
          TRANSIT_API_KEY: ${{ secrets.TRANSIT_API_KEY }}
        run: python -m wata.collect

      - name: Commit snapshot
        run: |
          git config user.name "wata-collector-bot"
          git config user.email "actions@github.com"
          git add data/raw/ data/processed/api_call_budget.json data/processed/poll_index.json
          git diff --cached --quiet || git commit -m "Add real-time snapshot $(date -u +%Y-%m-%dT%H:%M)"
          git push
