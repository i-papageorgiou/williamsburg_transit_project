name: Collect real-time snapshot

# Polls stop_departures for the 100-stop sample every 20 minutes across
# WATA's service span (05:54-22:57 ET). Requires the TRANSIT_API_KEY
# secret (Phase 0, pending) and a cached stop-id mapping at
# data/processed/stop_id_mapping.json before it can do anything but exit
# early with a clear error — see src/wata/collect.py.
#
# 20-minute granularity keeps this well under the free tier's 1,500
# calls/month even with GitHub Actions cron's few-minutes drift.

on:
  schedule:
    # Every 20 minutes, 10:00-02:59 UTC = 06:00-22:59 ET (covers DST both ways).
    - cron: "*/20 10-23 * * *"
    - cron: "*/20 0-2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Collect one snapshot
        env:
          TRANSIT_API_KEY: ${{ secrets.TRANSIT_API_KEY }}
        run: python -m wata.collect

      - name: Commit snapshot
        run: |
          git config user.name "wata-collector-bot"
          git config user.email "actions@github.com"
          git add data/raw/ data/processed/api_call_budget.json
          git diff --cached --quiet || git commit -m "Add real-time snapshot $(date -u +%Y-%m-%dT%H:%M)"
          git push
